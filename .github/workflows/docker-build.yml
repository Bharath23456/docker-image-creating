name: Build Docker Image

# 1. THE TRIGGER: When should this run?
on:
  push:
    branches:
      - main

# 2. THE RUNNER: Where should this run?
jobs:
  build:
    runs-on: ubuntu-latest

    # 3. THE STEPS: What exactly should it do?
    steps:
      # Step A: Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # Step B: Set up Docker's build engine (Buildx)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step C: Actually build the image!
      - name: Build the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # For this demo, we will just build the image to test it, not push it anywhere yet
          push: false
          tags: my-first-website:latest