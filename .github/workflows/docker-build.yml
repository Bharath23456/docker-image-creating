name: Build and Test Docker Image

# 1. THE TRIGGER
on:
  push:
    branches:
      - main

# 2. THE RUNNER
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 3. THE STEPS
    steps:
      # Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # --- TESTING STEPS ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run code tests
        run: npm test
      # ---------------------

      # Set up Docker's build engine (Only runs if npm test passes!)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image
      - name: Build the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: my-first-website:latest