steps:
      # Step A: Download your code onto the GitHub server
      - name: Checkout code
        uses: actions/checkout@v4

      # --- NEW TESTING STEPS ---
      # 1. Install the language runtime (e.g., Node.js)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. Install your app's dependencies
      - name: Install dependencies
        run: npm install

      # 3. Run the actual tests
      - name: Run code tests
        run: npm test
      # -------------------------

      # Step B: Set up Docker's build engine (Only runs if npm test passes!)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step C: Actually build the image!
      - name: Build the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: my-first-website:latest